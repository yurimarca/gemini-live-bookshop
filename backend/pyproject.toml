[project]
name = "bookshop-gateway"
version = "0.2.0"
description = "Voice bookshop gateway: FastAPI, ADK live agent, catalog and cart"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.127,<1",
    "uvicorn[standard]>=0.40,<1",
    "google-adk[gcp]~=2.14.1",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.12,<3",
    "firebase-admin>=7.0,<8",
    "google-cloud-firestore>=2.20,<3",
    "google-cloud-storage>=3.0,<4",
    "google-cloud-tasks>=2.19,<3",
    "google-auth>=2.40,<3",
    "httpx>=0.28,<1",
    "python-dotenv>=1.0,<2",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
