[project]
name = "olpipe"
version = "0.1.0"
description = "Open Library dump to bookshop catalog: fetch, chunk, publish"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.12,<3",
    "pyyaml>=6.0",
    "httpx>=0.28,<1",
    "google-cloud-storage>=3.0,<4",
    "google-cloud-firestore>=2.20,<3",
]

[project.scripts]
olpipe = "olpipe.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/olpipe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
