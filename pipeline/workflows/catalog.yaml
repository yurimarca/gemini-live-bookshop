# One run of the catalog pipeline, stages 1 to 6, from a pinned dump date.
#
#   gcloud workflows run catalog-pipeline --location=$REGION \
#     --data='{"dump_date":"2026-10-31","revision":"r1","use_editions":false}'
#
# Optional input: "skip_fetch": true re-runs from the load stage on data already in the lake.
# Deployed with env vars LAKE_BUCKET and JOB_NAME (see infra/setup.sh workflow).
main:
  params: [input]
  steps:
    - init:
        assign:
          - project: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - region: ${sys.get_env("GOOGLE_CLOUD_LOCATION")}
          - lake: ${sys.get_env("LAKE_BUCKET")}
          - job: ${sys.get_env("JOB_NAME")}
          - dump_date: ${input.dump_date}
          - revision: ${input.revision}
          - use_editions: ${default(map.get(input, "use_editions"), false)}
          - skip_fetch: ${default(map.get(input, "skip_fetch"), false)}
          - version: ${"ol-" + dump_date + "-" + revision}
          - raw: ${"gs://" + lake + "/raw/dump_date=" + dump_date + "/"}
          - bronze: ${"gs://" + lake + "/bronze/dump_date=" + dump_date + "/"}
          - dump_schema: "type:STRING,key:STRING,revision:INT64,last_modified:STRING,json:STRING"
          - files: "works,authors,reading-log,ratings,redirects"
    - add_edition_files:
        switch:
          - condition: ${use_editions}
            assign:
              - files: ${files + ",editions,wikidata"}
    - maybe_skip_fetch:
        switch:
          - condition: ${skip_fetch}
            next: seeds

    # Stage 1: fetch
    - fetch:
        call: run_job
        args: {project: "${project}", region: "${region}", job: "${job}",
               args: ["fetch", "${\"--dump-date=\" + dump_date}", "${\"--files=\" + files}"]}
    # Stage 2: chunk
    - chunk_works:
        call: run_job
        args: {project: "${project}", region: "${region}", job: "${job}",
               args: ["chunk", "${\"--dump-date=\" + dump_date}", "--file=works"]}
    - maybe_chunk_editions:
        switch:
          - condition: ${use_editions}
            steps:
              - chunk_editions:
                  call: run_job
                  args: {project: "${project}", region: "${region}", job: "${job}",
                         args: ["chunk", "${\"--dump-date=\" + dump_date}", "--file=editions"]}

    - seeds:
        call: run_job
        args: {project: "${project}", region: "${region}", job: "${job}",
               args: ["seeds", "${\"--revision=\" + revision}"]}

    # Stage 3: load. The JSON column stays a STRING; an empty quote character disables CSV quoting.
    - load_works:
        call: load_table
        args: {project: "${project}", region: "${region}", dataset: ol_raw, table: works,
               uris: ["${bronze + \"works/part-*.tsv\"}"], schema: "${dump_schema}", delimiter: "\t", quote: ""}
    - load_authors:
        call: load_table
        args: {project: "${project}", region: "${region}", dataset: ol_raw, table: authors,
               uris: ["${raw + \"ol_dump_authors_\" + dump_date + \".txt.gz\"}"], schema: "${dump_schema}", delimiter: "\t", quote: ""}
    - load_redirects:
        call: load_table
        args: {project: "${project}", region: "${region}", dataset: ol_raw, table: redirects,
               uris: ["${raw + \"ol_dump_redirects_\" + dump_date + \".txt.gz\"}"], schema: "${dump_schema}", delimiter: "\t", quote: ""}
    - load_reading_log:
        call: load_table
        args: {project: "${project}", region: "${region}", dataset: ol_raw, table: reading_log,
               uris: ["${raw + \"ol_dump_reading-log_\" + dump_date + \".txt.gz\"}"],
               schema: "work_key:STRING,edition_key:STRING,shelf:STRING,log_date:DATE", delimiter: "\t", quote: "", null_marker: "\\N"}
    - load_ratings:
        call: load_table
        args: {project: "${project}", region: "${region}", dataset: ol_raw, table: ratings,
               uris: ["${raw + \"ol_dump_ratings_\" + dump_date + \".txt.gz\"}"],
               schema: "work_key:STRING,edition_key:STRING,rating:INT64,rating_date:DATE", delimiter: "\t", quote: "", null_marker: "\\N"}
    - maybe_load_editions:
        switch:
          - condition: ${use_editions}
            steps:
              - load_editions:
                  call: load_table
                  args: {project: "${project}", region: "${region}", dataset: ol_raw, table: editions,
                         uris: ["${bronze + \"editions/part-*.tsv\"}"], schema: "${dump_schema}", delimiter: "\t", quote: ""}
              - load_wikidata:
                  # Wikidata JSON is CSV-quoted, so it keeps the default quote character.
                  call: load_table
                  args: {project: "${project}", region: "${region}", dataset: ol_raw, table: wikidata,
                         uris: ["${raw + \"ol_dump_wikidata_\" + dump_date + \".txt.gz\"}"],
                         schema: "id:STRING,json:STRING,updated:STRING", delimiter: "\t", quote: "\""}
    - load_seed_authors:
        call: load_table
        args: {project: "${project}", region: "${region}", dataset: ol_staging, table: seed_brazilian_authors,
               uris: ["${\"gs://\" + lake + \"/seeds/\" + revision + \"/brazilian_authors.csv\"}"],
               schema: "author_key:STRING,name:STRING,note:STRING,default_genre:STRING", delimiter: ",", quote: "\"", skip: 1}
    - load_seed_category_rules:
        call: load_table
        args: {project: "${project}", region: "${region}", dataset: ol_staging, table: seed_category_rules,
               uris: ["${\"gs://\" + lake + \"/seeds/\" + revision + \"/category_rules.csv\"}"],
               schema: "rule_id:INT64,category:STRING,applies:STRING,pattern:STRING,weight:INT64", delimiter: ",", quote: "\"", skip: 1}
    - load_seed_category_gold:
        call: load_table
        args: {project: "${project}", region: "${region}", dataset: ol_staging, table: seed_category_gold,
               uris: ["${\"gs://\" + lake + \"/seeds/\" + revision + \"/category_gold.csv\"}"],
               schema: "work_id:STRING,title:STRING,expected:STRING", delimiter: ",", quote: "\"", skip: 1}
    - load_seed_overrides:
        call: load_table
        args: {project: "${project}", region: "${region}", dataset: ol_staging, table: seed_overrides,
               uris: ["${\"gs://\" + lake + \"/seeds/\" + revision + \"/overrides.csv\"}"],
               schema: "work_key:STRING,action:STRING,reason:STRING", delimiter: ",", quote: "\"", skip: 1}

    # Stage 4: transform (Dataform models and assertions; a failed assertion fails the job)
    - transform_args:
        assign:
          - targs: ["transform", "${\"--dump-date=\" + dump_date}", "${\"--revision=\" + revision}"]
    - transform_with_editions:
        switch:
          - condition: ${use_editions}
            assign:
              - targs: ${list.concat(targs, "--use-editions")}
    - transform:
        call: run_job
        args: {project: "${project}", region: "${region}", job: "${job}", args: "${targs}"}

    # Stage 5: export
    - export:
        call: googleapis.bigquery.v2.jobs.insert
        args:
          projectId: ${project}
          body:
            jobReference: {location: "${region}"}
            configuration:
              query:
                useLegacySql: false
                query: ${"EXPORT DATA OPTIONS(uri='gs://" + lake + "/gold/" + version + "/catalog-*.json', format='JSON', overwrite=true) AS SELECT * FROM `" + project + ".ol_marts.catalog_books`"}

    # Stage 6: publish (writes Firestore and the index blob, flips the pointer last)
    - publish:
        call: run_job
        args: {project: "${project}", region: "${region}", job: "${job}",
               args: ["publish", "${\"--dataset-version=\" + version}", "--seeds-dir=seeds"]}
    - log_run:
        call: googleapis.bigquery.v2.jobs.insert
        args:
          projectId: ${project}
          body:
            jobReference: {location: "${region}"}
            configuration:
              load:
                destinationTable: {projectId: "${project}", datasetId: ol_ops, tableId: run_log}
                sourceUris: ["${\"gs://\" + lake + \"/runs/publish-\" + version + \"/run_log.ndjson\"}"]
                sourceFormat: NEWLINE_DELIMITED_JSON
                autodetect: true
                writeDisposition: WRITE_APPEND
                schemaUpdateOptions: [ALLOW_FIELD_ADDITION]
    - done:
        return: {dataset_version: "${version}"}

# Run the Cloud Run job with an argument override and poll until the execution ends.
# The polling is explicit because the connector's wait behaviour was not confirmed.
run_job:
  params: [project, region, job, args]
  steps:
    - start:
        call: http.post
        args:
          url: ${"https://run.googleapis.com/v2/projects/" + project + "/locations/" + region + "/jobs/" + job + ":run"}
          auth: {type: OAuth2}
          body:
            overrides:
              containerOverrides:
                - args: ${args}
        result: op
    - remember:
        assign:
          - execution: ${op.body.metadata.name}
    - wait:
        call: sys.sleep
        args: {seconds: 20}
    - poll:
        call: http.get
        args:
          url: ${"https://run.googleapis.com/v2/" + execution}
          auth: {type: OAuth2}
        result: state
    - check:
        switch:
          - condition: ${default(map.get(state.body, "succeededCount"), 0) >= 1}
            return: ${execution}
          - condition: ${default(map.get(state.body, "failedCount"), 0) >= 1 or default(map.get(state.body, "cancelledCount"), 0) >= 1}
            raise: '${"job failed - " + args[0] + " (" + execution + ")"}'
        next: wait

# BigQuery load job, WRITE_TRUNCATE. The connector waits for the job to finish.
load_table:
  params: [project, region, dataset, table, uris, schema, delimiter, quote, null_marker: null, skip: 0]
  steps:
    - fields:
        assign:
          - schema_fields: []
    - build_schema:
        for:
          value: column
          in: ${text.split(schema, ",")}
          steps:
            - add:
                assign:
                  - pair: ${text.split(column, ":")}
                  # Expressions cannot hold map literals, so the field is built as a YAML map first.
                  - field: {name: "${pair[0]}", type: "${pair[1]}"}
                  - schema_fields: ${list.concat(schema_fields, field)}
    - load:
        call: googleapis.bigquery.v2.jobs.insert
        args:
          projectId: ${project}
          body:
            jobReference: {location: "${region}"}
            configuration:
              load:
                destinationTable: {projectId: "${project}", datasetId: "${dataset}", tableId: "${table}"}
                sourceUris: ${uris}
                sourceFormat: CSV
                fieldDelimiter: ${delimiter}
                quote: ${quote}
                nullMarker: ${default(null_marker, "")}
                skipLeadingRows: ${skip}
                writeDisposition: WRITE_TRUNCATE
                schema: {fields: "${schema_fields}"}
